[Settings]
language = en
folder = ~/Pictures/Wallpapers
monitors = All
wallpaper = ~/Pictures/Wallpapers/vader-1.jpg
backend = hyprpaper
fill = fill
sort = name
color = #000000
subfolders = False
show_hidden = False
show_gifs_only = False
number_of_columns = 3
swww_transition_type = left
swww_transition_step = 90
swww_transition_angle = 270
swww_transition_duration = 1
swww_transition_fps = 60
use_xdg_state = False
post_command = caelestia wallpaper -f $wallpaper && wal -i $wallpaper
show_transition_options = True
show_path_in_tooltip = True
all_subfolders = False
mpvpaper_sound = False
mpvpaper_options = 
zen_mode = False

